# A ReplicaSet's purpose is to maintain a stable set of replica Pods running at any given time. As such, it is 
# often used to guarantee the availability of a specified number of identical Pods.

# A ReplicaSet ensures that a specified number of pod replicas are running at any given time. 
# However, a Deployment is a higher-level concept that manages ReplicaSets and provides declarative 
# updates to Pods along with a lot of other useful features. Therefore, we recommend using Deployments 
# instead of directly using ReplicaSets, unless you require custom update orchestration or don't require updates at all.

# This actually means that you may never need to manipulate ReplicaSet objects: use a Deployment instead, 
# and define your application in the spec section.
apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: frontend
  labels:
    app: guestbook
    tier: frontend
spec:
  replicas: 3
  selector:
    matchLabels:
      tier: frontend
  template:
    metadata:
      labels:
        tier: frontend
    spec:
      containers:
        - name: php-redis
          image: gcr.io/google_samples/gb-frontend:v3
