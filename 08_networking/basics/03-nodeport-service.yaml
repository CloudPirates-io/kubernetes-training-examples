# NodePort Service - Exposes service on a static port on each node's IP.
# Accessible from outside the cluster via <NodeIP>:<NodePort>.
# Opens the specified port (30000-32767) on EVERY node in the cluster.
# Use case: Development/testing, quick external access without load balancer.
apiVersion: v1
kind: Service
metadata:
  name: nginx-nodeport
  namespace: networking
  labels:
    app: nginx
spec:
  type: NodePort
  ports:
    - port: 80  # Service port (cluster-internal)
      targetPort: http  # Maps to container port named "http" (80)
      nodePort: 32730  # External port on each node (optional, auto-assigned if omitted)
      protocol: TCP
      name: http
  selector:
    app: nginx
  # externalTrafficPolicy: Cluster  # Default: distributes traffic across all nodes
  # externalTrafficPolicy: Local    # Alternative: only routes to pods on the receiving node (preserves source IP)
# Access: http://<any-node-ip>:32730
# NodePort range: 30000-32767 (configurable in kube-apiserver)
