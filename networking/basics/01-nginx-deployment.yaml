apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-nginx
  namespace: networking-example
spec:
  selector:
    matchLabels:
      run: my-nginx
  replicas: 2
  template:
    metadata:
      labels:
        run: my-nginx
    spec:
      containers:
        - name: my-nginx
          image: nginx
          ports:
            - containerPort: 80







# Internet -> :80 -> LoadBalancer (Cloud/"händisch") -> (Node IP):30100 -> "Cluster Intern" -> :30100 -> Service -> :80 Pod (NGINX) 


















