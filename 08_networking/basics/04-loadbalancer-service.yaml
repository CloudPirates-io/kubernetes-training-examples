# LoadBalancer Service - Provisions an external load balancer for the service.
# Automatically creates a NodePort and provisions a load balancer that routes to it.
# Works with cloud providers (AWS, Azure, GCP) and on-premises solutions (MetalLB, Cilium, kube-vip).
# Use case: Production external access with automated load balancer provisioning.
apiVersion: v1
kind: Service
metadata:
  name: nginx-loadbalancer
  namespace: networking
  labels:
    app: nginx
spec:
  type: LoadBalancer
  ports:
    - port: 80  # External load balancer port
      targetPort: http  # Maps to container port named "http" (80)
      protocol: TCP
      name: http
  selector:
    app: nginx
# Traffic flow: Internet → LoadBalancer:80 → NodePort:3xxxx → Pods:80

# Important: LoadBalancer Services work out-of-the-box only in cloud environments!
# Cloud providers automatically provision load balancers when Service type=LoadBalancer is created.
# On bare-metal/on-premises clusters, additional setup is required (install and configure a LoadBalancer controller).

# LoadBalancer Implementations:
#
# Cloud Providers (no additional setup required):
# - AWS: Elastic Load Balancer (ELB/ALB/NLB) - automatic provisioning
# - Azure: Azure Load Balancer - automatic provisioning
# - GCP: Google Cloud Load Balancer - automatic provisioning
#
# On-Premises / Bare-Metal (requires installation and configuration):
# - MetalLB: L2/BGP load balancer (most common for bare-metal)
# - Cilium: BGP-based load balancer with eBPF (requires Cilium CNI)
# - kube-vip: Virtual IP and load balancing
# - VMware NSX: Load balancer for vSphere environments
# - OpenStack Octavia: Load balancer for OpenStack clouds
#
# Without LoadBalancer controller: External IP stays <pending> indefinitely (e.g., minikube/kind/kubeadm without setup)
