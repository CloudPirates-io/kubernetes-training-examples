# TLS/HTTPS Ingress - Automatic certificate provisioning via cert-manager.
# cert-manager watches for Ingress resources with TLS configuration and automatically:
# 1. Requests certificate from specified issuer (ClusterIssuer or Issuer)
# 2. Completes ACME challenge
# 3. Stores certificate in specified Secret
# 4. Renews certificate automatically before expiration
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tls-ingress
  namespace: ingress
  # annotations:
    # cert-manager.io/cluster-issuer: "letsencrypt-staging"  # References ClusterIssuer to use (not needed if default issuer is set in cert-manager config)
    # For Issuer (namespace-scoped): cert-manager.io/issuer: "my-issuer"
spec:
  ingressClassName: nginx
  tls:
    - secretName: echoserver-tls  # Secret where cert-manager stores the certificate
      hosts:
        - echoserver.example.com  # Domain(s) to secure (must match DNS)
  rules:
    - host: echoserver.example.com
      http:
        paths:
          - pathType: Prefix
            path: /
            backend:
              service:
                name: echoserver
                port:
                  name: http
# Prerequisites:
# 1. cert-manager installed in cluster
# 2. ClusterIssuer created (e.g., letsencrypt-staging)
# 3. DNS records pointing domain to Ingress controller's external IP (http01 challenge)
# 4. Ingress controller configured to handle TLS

# Certificate status: kubectl get certificate -n ingress
# Certificate details: kubectl describe certificate echoserver-tls -n ingress
