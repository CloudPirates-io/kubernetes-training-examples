# Secret with stringData - Easier Secret creation without manual base64 encoding.
# The API server automatically encodes stringData values to base64.
# Best practice for development and GitOps (when combined with SealedSecrets).
apiVersion: v1
kind: Secret
metadata:
  name: redis
  namespace: config-management
type: Opaque
# stringData: API server handles base64 encoding automatically
# No need to manually encode values before applying
stringData:
  username: wordpress
  password: mysecretpass
  # You can also include non-secret config data that logically belongs together
  # (e.g., database credentials with hostname and port)
  hostname: localhost
  port: "3306"  # Must be string, not integer