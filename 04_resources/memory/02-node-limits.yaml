# Memory Node Limits - Demonstrates what happens when requesting more memory than available on node.
# This pod will remain in "Pending" state because no node has 100Gi memory available.
apiVersion: v1
kind: Pod
metadata:
  name: memory-node-limits
  namespace: resources
spec:
  containers:
    - name: memory-node-limits
      image: nginx
      resources:
        requests:
          memory: 100Gi  # Intentionally excessive - exceeds typical node capacity
        limits:
          memory: 100Gi
