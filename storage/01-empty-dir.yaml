apiVersion: v1
kind: Pod
metadata:
  name: test-empty-dir
spec:
  containers:
    - image: nginx
      name: test-container
      resources:
        limits:
          cpu: 100m
          memory: 25Mi
      volumeMounts:
        - mountPath: /cache
          name: cache
    - image: nginx
      command:
        - "sleep"
      args:
        - "3600"
      env:
        - name: NGINX_PORT
          value: "8080"
      name: sidecar
      resources:
        limits:
          cpu: 100m
          memory: 25Mi
      volumeMounts:
        - mountPath: /data/test
          name: cache
  volumes:
    - name: cache
      emptyDir: {}
