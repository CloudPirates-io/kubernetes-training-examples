# A Deployment provides declarative updates for Pods and ReplicaSets.
# Used for statelesss applications.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deployment
spec:
  replicas: 1 # Default 1 (Best Practice: Dont set in YAML to scale independently from CI/CD and/or horizontal autoscaling)
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          resources:
            limits: {}
