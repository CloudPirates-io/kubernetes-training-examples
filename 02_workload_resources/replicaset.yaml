# ReplicaSet - Maintains a stable set of replica Pods running at any given time.
# Ensures a specified number of identical Pods are always available.
# Note: Use Deployments instead of ReplicaSets directly for better update management and features.
apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: frontend
  labels:
    app: guestbook
    tier: frontend
spec:
  replicas: 3
  selector:
    matchLabels:
      tier: frontend
  template:
    metadata:
      labels:
        tier: frontend
    spec:
      containers:
        - name: php-redis
          image: gcr.io/google_samples/gb-frontend:v3
