# ClusterIP Service - Internal cluster communication only (default type).
# Accessible only from within the cluster via cluster-internal IP address.
# Use case: Internal microservices communication, databases, backend services.
apiVersion: v1
kind: Service
metadata:
  name: nginx-clusterip
  namespace: networking
spec:
  type: ClusterIP  # Default type - can be omitted
  ports:
    - port: 80  # Service port (cluster-internal)
      targetPort: http  # Maps to container port named "http" (80)
      protocol: TCP
      name: http
  selector:
    app: nginx  # Selects pods with label app=nginx
# Access: Only from within cluster (e.g., curl nginx-clusterip.networking.svc.cluster.local)
