# Secret - Stores small amounts of sensitive data (passwords, tokens, keys).
# Prevents confidential data from being embedded in Pod specs or container images.
# IMPORTANT: Secrets are base64 encoded, NOT encrypted. Enable etcd encryption and use SealedSecrets for GitOps.
# Type Opaque: Generic secret for arbitrary user-defined data.
apiVersion: v1
kind: Secret
metadata:
  name: manual
  namespace: config-management
type: Opaque
data:
  # Values must be base64 encoded
  # username = base64("username")
  username: dXNlcm5hbWU=
  # password = base64("admin-password")
  password: YWRtaW4tcGFzc3dvcmQ=
