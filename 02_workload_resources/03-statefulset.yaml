# StatefulSet - Manages stateful applications with stable, persistent identities.
# Provides stable network identities (DNS/hostname) and persistent storage for each Pod.
# Guarantees ordered deployment, scaling, and updates. Use for databases, caches, and clustered apps.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: workload-resources
spec:
  replicas: 3
  serviceName: redis-headless  # Headless service for stable network identities
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:alpine
          resources:
            limits: {}