apiVersion: networking.k8s.io/v1beta1
kind: Ingress
metadata:
  name: path-ingress
  namespace: ingress-example
  annotations:
#    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  rules:
    - http:
        paths:
          - path: /echoserver
            backend:
              serviceName: echoserver
              servicePort: 8080
