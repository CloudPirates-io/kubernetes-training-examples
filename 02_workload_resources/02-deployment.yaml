# Deployment - Manages stateless applications with declarative updates for Pods and ReplicaSets.
# Provides rolling updates, rollbacks, and scaling capabilities. Recommended for most workloads.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deployment
  namespace: workload-resources
spec:
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          resources:
            limits: {}
