# Secret Usage - Single Values as Environment Variables
# Best practice: Explicitly map individual keys for better validation and visibility.
# This approach fails fast if a required key is missing (unless marked optional: true).
apiVersion: v1
kind: Pod
metadata:
  name: secret-env-single
  namespace: config-management
spec:
  restartPolicy: Never
  containers:
    - name: mycontainer
      image: redis
      resources:
        limits: {}
      # Individual Secret keys as environment variables
      env:
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: redis  # References secret created in 02-stringdata-secret.yaml
              key: username
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: redis
              key: password
        - name: DB_HOST
          valueFrom:
            secretKeyRef:
              name: redis
              key: hostname
        - name: DB_PORT
          valueFrom:
            secretKeyRef:
              name: redis
              key: port
