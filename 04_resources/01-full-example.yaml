# Resource Requests and Limits - Control container resource allocation and consumption.
# Requests: Minimum guaranteed resources (used for scheduling). Limits: Maximum allowed resources (enforced at runtime).
# Best Practice: Set memory requests = limits for guaranteed QoS. CPU can be burstable (requests < limits).
apiVersion: v1
kind: Pod
metadata:
  name: full-example
  namespace: resources
spec:
  containers:
    - name: nginx
      image: nginx
      resources:
        # Requests - Minimum guaranteed resources for scheduling
        requests:
          # Memory request - guaranteed memory allocation
          # Setting requests = limits provides "Guaranteed" QoS class (prevents eviction under memory pressure)
          memory: 56Mi
          # CPU request - guaranteed CPU time in millicores (10m = 0.01 CPU cores)
          cpu: 10m
        # Limits - Maximum allowed resource consumption (hard caps)
        limits:
          # Memory limit - container killed (OOMKilled) if exceeded
          # Match request for predictable memory allocation
          memory: 56Mi
          # CPU limit - container throttled if exceeded (not killed)
          # Higher than request allows bursting for traffic spikes
          cpu: 500m
