apiVersion: batch/v1
kind: Job
metadata:
  name: pi
spec:
  completions: 5000
  parallelism: 50
  template:
    spec:
      containers:
        - name: pi
          imagePullPolicy: IfNotPresent
          image: perl:threaded-stretch
          command: ["perl",  "-Mbignum=bpi", "-wle", "print bpi(2000)"]
      restartPolicy: Never
  backoffLimit: 4
