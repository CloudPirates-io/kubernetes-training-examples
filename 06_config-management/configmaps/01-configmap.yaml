# ConfigMap - Stores non-confidential configuration data in key-value pairs.
# Decouples configuration from container images, making applications more portable.
# Use for: application settings, environment variables, command-line arguments, config files.
apiVersion: v1
kind: ConfigMap
metadata:
  name: test-config
  namespace: config-management
data:
  # single values
  configKey: my-config-value
  foo: bar
  # boolean and integer values must be escaped
  errorReporting: "1"
  debug: "true"
  # multiline config examples
  config.php: |
    <?php
    $foo = 'bar';
    $test = 'Hallo';
  jsonConfig: |
    {
      "foo": "bar",
      "key": "value"
    }
  gameProperties: |
    enemies=aliens
    lives=3
    enemies.cheat=true
    enemies.cheat.level=noGoodRotten
    secret.code.passphrase=UUDDLRLRBABAS
    secret.code.allowed=true
    secret.code.lives=30
