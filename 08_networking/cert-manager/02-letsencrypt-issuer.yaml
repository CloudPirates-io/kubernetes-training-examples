# Let's Encrypt ClusterIssuer - Issues free, trusted SSL/TLS certificates.
# Let's Encrypt Staging: Use for testing to avoid hitting production rate limits (50 certificates per domain every 7 days).
# Let's Encrypt Production: Use after testing succeeds - trusted by all browsers.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory  # Staging server (not trusted)
    # Production server: https://acme-v02.api.letsencrypt.org/directory
    email: admin@example.com  # Email for lets encrypt account creation (expiry emails are not sent anymore)
    privateKeySecretRef:
      name: letsencrypt-staging-key  # Secret to store ACME account private key
    solvers:
      - http01:  # HTTP-01 challenge: Proves domain ownership via HTTP endpoint
          ingress:
            class: nginx  # Ingress controller to use for ACME challenges
# ACME Challenge Types:
# - http01: Proves ownership by serving file on http://<domain>/.well-known/acme-challenge/
# - dns01: Proves ownership by creating DNS TXT record (required for wildcard certificates)

# Rate Limits (Let's Encrypt Production):
# - 50 certificates per registered domain per week
# - 5 duplicate certificates per week
# Use staging first to avoid hitting limits!
