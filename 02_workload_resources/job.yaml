# Job - Runs Pods to completion for batch processing and one-off tasks.
# Retries until a specified number of Pods successfully terminate.
# Use for data processing, batch computations, database migrations, and backup operations.
apiVersion: batch/v1
kind: Job
metadata:
  name: pi
spec:
  completions: 1
  parallelism: 1
  backoffLimit: 4
  suspend: false
  # ttlSecondsAfterFinished: 120 # Automatically delete job after x seconds (Important: Delete will happen independent from status)
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: pi
          imagePullPolicy: IfNotPresent
          image: perl:threaded-stretch
          command: ["perl", "-Mbignum=bpi", "-wle", "print bpi(2000)"]
