# GatewayParameters - Customizes the kgateway-managed Gateway infrastructure.
# Configures the underlying Service as NodePort so the Gateway is reachable
# from outside the cluster without a cloud load balancer.
apiVersion: gateway.kgateway.dev/v1alpha1
kind: GatewayParameters
metadata:
  name: custom-gw-params
  namespace: kgateway-system
spec:
  kube:
    service:
      type: NodePort
      ports:
        - port: 8080
          nodePort: 30080
        - port: 8443
          nodePort: 30443
---
# Gateway - Entry point for all HTTP and HTTPS traffic into the cluster.
# References GatewayParameters above to configure its Service as NodePort.
# HTTPRoutes in any namespace can attach to this Gateway.
kind: Gateway
apiVersion: gateway.networking.k8s.io/v1
metadata:
  name: public
  namespace: kgateway-system
  annotations:
    # cert-manager issues the certificate for the https listener (see cert-manager/).
    # Self-signed works for the wildcard hostname. Let's Encrypt via HTTP-01 does not support wildcards,
    # use letsencrypt-staging only with a concrete hostname on managed training environments.
    cert-manager.io/cluster-issuer: selfsigned-issuer
spec:
  gatewayClassName: kgateway
  infrastructure:
    parametersRef:
      name: custom-gw-params
      group: gateway.kgateway.dev
      kind: GatewayParameters
  listeners:
    - protocol: HTTP
      port: 8080
      name: http
      allowedRoutes:
        namespaces:
          from: All
    - protocol: HTTPS
      port: 8443
      name: https
      tls:
        mode: Terminate
        certificateRefs:
          - name: public-tls # Secret created by cert-manager
      allowedRoutes:
        namespaces:
          from: All
