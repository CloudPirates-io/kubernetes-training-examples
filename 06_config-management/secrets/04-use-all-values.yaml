# Secret Usage - All Values via envFrom
# Loads ALL Secret keys as environment variables automatically.
# WARNING: Not recommended - no validation, can cause conflicts, hard to track what's being loaded.
# Prefer explicit mapping (03-use-single-value.yaml) for production use.
apiVersion: v1
kind: Pod
metadata:
  name: secret-env-all
  namespace: config-management
spec:
  restartPolicy: Never
  containers:
    - name: test-container
      image: busybox
      resources:
        limits: {}
      command: ["/bin/sh", "-c", "env"]
      # envFrom loads ALL Secret keys automatically
      # Drawbacks: No validation, unexpected variables, naming conflicts
      envFrom:
        - secretRef:
            name: redis  # References secret created in 02-stringdata-secret.yaml
