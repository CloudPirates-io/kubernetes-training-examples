# Canary Ingress - Routes subset of traffic to V2 for testing.
# Two canary strategies available (comment/uncomment annotations to enable):
# 1. Header-Based: Route traffic based on HTTP header (for specific users/testing)
# 2. Weight-Based: Route percentage of traffic (for gradual rollout)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: demo-app-canary
  namespace: rolling-updates
  annotations:
    nginx.ingress.kubernetes.io/canary: "true"  # Marks this as a canary ingress

    # Strategy 1: Header-Based Canary (currently active)
    # Routes to V2 only when header matches: x-version: v2
    # Test: curl -H "x-version: 2" http://rollingupdates.127-0-0-1.nip.io
    nginx.ingress.kubernetes.io/canary-by-header: "x-version"
    nginx.ingress.kubernetes.io/canary-by-header-value: "2"

    # Strategy 2: Weight-Based Canary (commented out)
    # Routes 25% of traffic to V2, 75% to V1
    # To use: Comment out header annotations above, uncomment weight below
    # nginx.ingress.kubernetes.io/canary-weight: "25"
spec:
  ingressClassName: nginx
  rules:
    # Set correct hostname for managed training
    # environments (rollingupdates.clusterxx.training.cloudpirates.io)
    - host: rollingupdates.127-0-0-1.nip.io
      http:
        paths:
          - pathType: Prefix
            path: /
            backend:
              service:
                name: demo-app-v2  # Routes canary traffic to V2
                port:
                  name: http

# Canary Demo Workflow:
#
# 1. Header-Based Canary (Default):
#    - Normal traffic: curl http://rollingupdates.127-0-0-1.nip.io/color (goes to V1)
#    - Canary traffic: curl -H "x-version: v2" http://rollingupdates.127-0-0-1.nip.io/color (goes to V2)
#
# 2. Switch to Weight-Based Canary:
#    - Comment out canary-by-header and canary-by-header-value
#    - Uncomment canary-weight: "25"
#    - kubectl apply -f 03-ingress-canary.yaml
#    - Test: for i in {1..10}; do curl http://rollingupdates.127-0-0-1.nip.io/color; done
#    - ~25% of requests will go to V2
#
# Important: Header-based canary takes precedence over weight-based if both are active!
