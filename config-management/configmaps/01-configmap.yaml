apiVersion: v1
kind: ConfigMap
metadata:
  name: test-config
  namespace: config-example
data:
  # single values
  config-key: my-config-value
  foo: bar
  error_reporting: "1"
  debug: "true"
  db_host: test
  # multiline config
  game.properties: |
    enemies=aliens
    lives=3
    enemies.cheat=true
    enemies.cheat.level=noGoodRotten
    secret.code.passphrase=UUDDLRLRBABAS
    secret.code.allowed=true
    secret.code.lives=30
  ui.properties: |
    color.good=purple
    color.bad=yellow
    allow.textmode=true
    how.nice.to.look=fairlyNice
