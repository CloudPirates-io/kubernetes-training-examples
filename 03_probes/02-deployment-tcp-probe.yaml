# TCP Socket Probe - Tests if a TCP connection can be established to a container port.
# Useful for non-HTTP services like databases, caches, or custom TCP protocols.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tcp-probe-example
  namespace: probes
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:alpine
          ports:
            - containerPort: 6379
              name: redis
              protocol: TCP
          # Startup probe using TCP socket
          startupProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 0
            periodSeconds: 5
            failureThreshold: 30
            successThreshold: 1
            timeoutSeconds: 1
          # Readiness probe using TCP socket
          readinessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 0
            periodSeconds: 5
            failureThreshold: 1
            successThreshold: 1
            timeoutSeconds: 1
          # Liveness probe using TCP socket
          livenessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 1
            successThreshold: 1
            timeoutSeconds: 1
          resources:
            limits: {}
