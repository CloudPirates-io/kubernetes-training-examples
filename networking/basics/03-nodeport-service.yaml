apiVersion: v1
kind: Service
metadata:
  name: nodeport-my-nginx
  namespace: networking-example
  labels:
    run: my-nginx
spec:
  # opens a defined port on EVERY node in the cluster (range: 30000-32767)
  type: NodePort
  ports:
    - port: 80
      targetPort: 80
      nodePort: 32730
      protocol: TCP
  selector:
    run: my-nginx
