# Single Secret key/value usage inside ENV
apiVersion: v1
kind: Pod
metadata:
  name: secret-env-pod
spec:
  restartPolicy: Never
  containers:
    - name: mycontainer
      image: redis
      resources:
          limits:
            cpu: 100m
            memory: 10Mb
      env:
        - name: SECRET_USERNAME
          valueFrom:
            secretKeyRef:
              name: mysecret
              key: username
        - name: USERNAME
          valueFrom:
            configMapKeyRef:
              name: mysecret
              key: username
        - name: SECRET_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mysecret
              key: password
---
# Use secret as volume
apiVersion: v1
kind: Pod
metadata:
  name: mypod
spec:
  containers:
    - name: mypod
      image: redis
      volumeMounts:
        - name: foo
          mountPath: "/etc/foo"
          readOnly: true
  volumes:
    - name: foo
      secret:
        secretName: mysecret
# After creating keys are files with values as content
# /etc/foo/key -> value
# /etc/foo/other-key -> other-value
