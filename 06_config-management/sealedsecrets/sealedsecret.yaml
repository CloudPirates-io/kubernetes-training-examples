# SealedSecret - Encrypted secret safe to store in Git repositories.
# Generated with: kubeseal -o yaml < example-secret.yaml > sealedsecret.yaml
# The controller in the cluster decrypts this and creates a regular Secret.
# Cannot be decrypted without the private key held by the sealed-secrets-controller.
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  creationTimestamp: null
  name: wordpressdb
  namespace: config-management
spec:
  # Encrypted data - safe to commit to Git
  encryptedData:
    host: 
    password: 
    port: 
    username: 
  template:
    metadata:
      creationTimestamp: null
      name: wordpressdb
      namespace: config-management
    type: Opaque
