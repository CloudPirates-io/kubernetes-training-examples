# Service V2 - Routes traffic to canary deployment (V2).
# Separate service for canary ingress to target.
apiVersion: v1
kind: Service
metadata:
  name: demo-app-v2
  namespace: rolling-updates
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app: demo-app-v2  # Routes only to V2 pods
  sessionAffinity: None
