# Example Unencrypted Secret - DO NOT APPLY TO CLUSTER OR COMMIT TO GIT
# This file shows the original secret before encryption with kubeseal.
# Use this as input to create a SealedSecret: kubeseal -o yaml < example-secret.yaml > sealedsecret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: wordpressdb
  namespace: config-management
type: Opaque
stringData:
  host: localhost
  port: "3306"
  username: wordpress
  password: mysecretpass