# Deployment - Creates pods for demonstrating different Service types.
# This nginx deployment will be exposed via ClusterIP, NodePort, and LoadBalancer services.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: networking
spec:
  replicas: 2  # Multiple replicas to demonstrate load balancing
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
        - name: nginx
          image: nginx
          resources:
            limits: {}
          ports:
            - containerPort: 80
              name: http
              protocol: TCP
