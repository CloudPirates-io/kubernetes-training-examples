# Service - Load balances traffic across all demo-app pods.
# Automatically updates endpoints as pods are created/destroyed during rolling updates.
apiVersion: v1
kind: Service
metadata:
  name: demo-app
  namespace: rolling-updates
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app: demo-app  # Routes to all pods with this label
  sessionAffinity: None
