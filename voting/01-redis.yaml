apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: voting
spec:
  serviceName: redis
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:alpine
          ports:
            - containerPort: 6379
              name: redis
              protocol: TCP
          resources:
            requests:
              cpu: 10m
              memory: 20Mi
            limits:
              cpu: 500m
              memory: 500Mi
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: voting
spec:
  type: ClusterIP
  selector:
    app: redis
  ports:
  - port: 6379
    name: redis