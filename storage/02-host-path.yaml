apiVersion: v1
kind: Pod
metadata:
  name: test-hostpath
spec:
  containers:
    - image: k8s.gcr.io/test-webserver
      name: test-container
      volumeMounts:
        - mountPath: /test-pd
          name: test-volume
  volumes:
    - name: test-volume
      hostPath:
        # directory location on host
        path: /tmp/data
        # this field is optional
        type: DirectoryOrCreate
