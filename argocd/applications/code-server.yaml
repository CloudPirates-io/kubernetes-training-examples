apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: code-server
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'https://gitlab.cloudpirates.io/cloudpirate/schulungen/examples.git'
    path: argocd/code-server
    targetRevision: main
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: code-server
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
