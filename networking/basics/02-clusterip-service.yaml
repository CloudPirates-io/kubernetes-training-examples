apiVersion: v1
kind: Service
metadata:
  name: my-nginx
  namespace: networking-example
  labels:
    run: my-nginx
spec:
  # type of the service (default ClusterIP)
  type: ClusterIP
  # ports assigned to this service
  ports:
    - port: 80
      protocol: TCP
  # selector for the assigned pods
  selector:
    run: my-nginx
