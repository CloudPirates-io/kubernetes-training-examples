# Ingress - Exposes the demo-app service externally via HTTP.
# Routes traffic to the active deployment (demo-app).
# For Blue/Green: Update backend service name to switch traffic instantly.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: demo-app
  namespace: rolling-updates
spec:
  ingressClassName: nginx
  rules:
    # Set correct hostname for managed training
    # environments (rollingupdates.clusterxx.training.cloudpirates.io)
    - host: rollingupdates.127-0-0-1.nip.io
      http:
        paths:
          - pathType: Prefix
            path: /
            backend:
              service:
                name: demo-app 
                port:
                  name: http
