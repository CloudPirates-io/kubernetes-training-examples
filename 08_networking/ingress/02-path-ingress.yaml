# Path-Based Ingress - Routes traffic based on URL path.
# Single hostname with multiple path-based backends.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: path-based
  namespace: ingress
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"  # Disable automatic HTTPS redirect
spec:
  ingressClassName: nginx  # Specifies which Ingress controller to use
  rules:
    - http:  # No host specified - matches any hostname
        paths:
          - path: /echoserver
            pathType: Prefix  # Matches /echoserver and /echoserver*
            backend:
              service:
                name: echoserver
                port:
                  name: http
# PathType options:
# - Prefix: Matches path prefix (e.g., /echoserver matches /echoserver/foo)
# - Exact: Matches exact path only (e.g., /echoserver does not match /echoserver/foo)
# - ImplementationSpecific: Depends on Ingress controller implementation (not recommended)

# Access: http://<ingress-ip>/echoserver
