# Probes - Health check mechanisms to monitor container status in Kubernetes.
# Three types: startupProbe (initial startup), readinessProbe (traffic routing), livenessProbe (restart unhealthy containers)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: probe-example
  namespace: probes
spec:
  # Set strategy "Recreate" to demonstrate all pods are terminated before new ones start
  # Use "RollingUpdate" in production for zero-downtime deployments
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
        - name: nginx
          image: nginx
          # Readiness probe - Determines if container is ready to receive traffic
          # Failed readiness removes pod from service endpoints (no restarts)
          readinessProbe:
            # HTTP probe type - checks if endpoint returns success (200-399)
            httpGet:
              path: /
              port: 80
              scheme: HTTP
            # Wait before first check after startup probe succeeds
            initialDelaySeconds: 0
            # Check every X seconds
            periodSeconds: 5
            # Mark as not ready after X failed checks
            failureThreshold: 1
            # Mark as ready after X successful checks
            successThreshold: 1
            # Timeout for the HTTP request
            timeoutSeconds: 1
          # Liveness probe - Determines if container is healthy (restarts if failing)
          # Failed liveness causes container restart
          livenessProbe:
            # HTTP probe checking same endpoint
            httpGet:
              path: /
              port: 80
              scheme: HTTP
            # Wait before first check after startup probe succeeds
            initialDelaySeconds: 10
            # Check every X seconds
            periodSeconds: 5
            # Restart after X consecutive failures
            failureThreshold: 1
            # Mark as healthy after X successful checks
            successThreshold: 1
            # Timeout for the HTTP request
            timeoutSeconds: 1
          # Assigned resources to this container
          resources:
            limits: {}
          # container ports
          ports:
            - containerPort: 80
              name: web
              protocol: TCP
