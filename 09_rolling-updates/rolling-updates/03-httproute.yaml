# HTTPRoute - Exposes the demo-app service externally via the Gateway.
# Routes all traffic to the active deployment (demo-app).
# For Blue/Green: Replace backendRef name to switch traffic instantly.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: demo-app
  namespace: rolling-updates
spec:
  parentRefs:
    - name: http
      namespace: kgateway-system
  hostnames:
    - rollingupdates.127-0-0-1.nip.io
  rules:
    - backendRefs:
        - name: demo-app
          port: 3000
