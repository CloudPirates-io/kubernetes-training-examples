# CPU Node Limits - Demonstrates what happens when requesting more CPU than available on node.
# This pod will remain in "Pending" state because no node has 100 CPU cores available.
# Useful for teaching about resource constraints and pod scheduling failures.
apiVersion: v1
kind: Pod
metadata:
  name: cpu-node-limits
  namespace: resources
spec:
  containers:
    - name: cpu-node-limit
      image: nginx
      resources:
        requests:
          cpu: "100" # 100 full cores (not millicores) - intentionally excessive
        limits:
          cpu: "100"
