# Exec Probe - Executes a command inside the container to determine health.
# Command exit code 0 = success, non-zero = failure. Useful for custom health check logic.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: exec-probe-example
  namespace: probes
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:alpine
          env:
            - name: POSTGRES_PASSWORD
              value: example
            - name: POSTGRES_DB
              value: testdb
          ports:
            - containerPort: 5432
              name: postgres
              protocol: TCP
          # Startup probe using command execution
          startupProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -U postgres
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 30
            successThreshold: 1
            timeoutSeconds: 5
          # Readiness probe using command execution
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -U postgres
            initialDelaySeconds: 0
            periodSeconds: 5
            failureThreshold: 1
            successThreshold: 1
            timeoutSeconds: 3
          # Liveness probe using command execution
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -U postgres
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 1
            successThreshold: 1
            timeoutSeconds: 5
          resources:
            limits: {}
