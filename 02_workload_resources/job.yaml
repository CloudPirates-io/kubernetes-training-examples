# A Job creates one or more Pods and will continue to retry execution of the Pods until a specified
# number of them successfully terminate. As pods successfully complete, the Job tracks the successful
# completions. When a specified number of successful completions is reached, the task (ie, Job) is complete.
# Deleting a Job will clean up the Pods it created. Suspending a Job will delete its active Pods until
# the Job is resumed again.
apiVersion: batch/v1
kind: Job
metadata:
  name: pi
spec:
  completions: 1
  parallelism: 1
  backoffLimit: 4
  suspend: false
  # ttlSecondsAfterFinished: 120 # Automatically delete job after x seconds (Important: Delete will happen independent from status)
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: pi
          imagePullPolicy: IfNotPresent
          image: perl:threaded-stretch
          command: ["perl", "-Mbignum=bpi", "-wle", "print bpi(2000)"]
