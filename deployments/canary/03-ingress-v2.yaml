apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: demo-ingress-v2
  namespace: rolling-updates
  annotations:
    nginx.ingress.kubernetes.io/canary: "true"
    nginx.ingress.kubernetes.io/canary-by-header: "x-version"
    nginx.ingress.kubernetes.io/canary-by-header-value: "2"
    # nginx.ingress.kubernetes.io/canary-weight: "100"
    # nginx.ingress.kubernetes.io/traffic-shadow: demo-app
    # Canary percentage
    # nginx.ingress.kubernetes.io/canary-weight: "25"
    # OR canary by header and/or header-value
spec:
  ingressClassName: nginx
  rules:
    - host: "rollingupdates.de"
      http:
        paths:
          - pathType: ImplementationSpecific
            path: "/"
            backend:
              service:
                name: demo-app-v2
                port:
                  number: 8080
