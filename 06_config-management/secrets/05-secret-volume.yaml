# Secret Usage - Volume Mount
# Mounts Secret keys as files in a directory. Each key becomes a separate file.
# Use for: certificates, config files, or when applications read credentials from files.
apiVersion: v1
kind: Pod
metadata:
  name: secret-volume
  namespace: config-management
spec:
  restartPolicy: Never
  containers:
    - name: mycontainer
      image: busybox
      resources:
        limits: {}
      command:
        - "/bin/sh"
        - "-c"
        - |
          echo "=========================================="
          echo "Secret Volume Mount Demonstration"
          echo "=========================================="
          echo ""
          echo "1. Listing all files in /etc/secrets/:"
          echo "   (Each Secret key becomes a file)"
          echo "------------------------------------------"
          ls -lah /etc/secrets/
          echo ""
          echo "2. Showing file contents:"
          echo "------------------------------------------"
          echo "username: $(cat /etc/secrets/username)"
          echo "password: $(cat /etc/secrets/password)"
          echo "hostname: $(cat /etc/secrets/hostname)"
          echo "port: $(cat /etc/secrets/port)"
          echo ""
          echo "3. File permissions (should be 0400):"
          echo "------------------------------------------"
          stat -c '%a %n' /etc/secrets/* || stat -f '%OLp %N' /etc/secrets/*
          echo ""
          echo "=========================================="
      volumeMounts:
        - name: secret-volume
          mountPath: /etc/secrets
          readOnly: true  # Best practice: mount secrets as read-only
  volumes:
    - name: secret-volume
      secret:
        secretName: redis  # References secret created in 02-stringdata-secret.yaml
        # Each key becomes a file: /etc/secrets/username, /etc/secrets/password, etc.
        # File permissions: 0400 (read-only for owner)
        # Optional: specify which keys to mount and their paths
        # items:
        #   - key: username
        #     path: db-username
        #     mode: 0400
